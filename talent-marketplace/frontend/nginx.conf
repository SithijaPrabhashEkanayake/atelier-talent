server {
    listen 80;

    # Baseline security headers
    add_header X-Content-Type-Options nosniff always;
    add_header X-Frame-Options DENY always;
    add_header Referrer-Policy strict-origin-when-cross-origin always;
    # img-src allows any https source because portfolio/profile photos are
    # served from Cloudinary (production) and placeholder services like
    # pravatar.cc (seed/demo data) — both third-party https CDNs, not
    # same-origin. style-src needs 'unsafe-inline' for Tailwind's and
    # React's inline styles, plus fonts.googleapis.com because index.css
    # `@import`s the Inter font's stylesheet from there (that stylesheet in
    # turn references font files on fonts.gstatic.com, hence font-src).
    # There's no inline JavaScript, so script-src stays locked to 'self'.
    add_header Content-Security-Policy "default-src 'self'; script-src 'self'; style-src 'self' 'unsafe-inline' https://fonts.googleapis.com; img-src 'self' https: data:; font-src 'self' data: https://fonts.gstatic.com; connect-src 'self'; frame-ancestors 'none'" always;

    # Root directory for static files
    root /usr/share/nginx/html;
    index index.html;

    # Handle React routing
    location / {
        try_files $uri $uri/ /index.html;
    }

    # Proxy API requests to backend. Deliberately NO trailing path after the
    # port here (unlike a naive `http://backend:5000/`) — per nginx's
    # proxy_pass semantics, a URI part after the address makes nginx
    # substitute the matched `/api/` prefix out of the forwarded request.
    # Every backend route is mounted at `/api/...` (see backend/server.js),
    # so stripping that prefix 404s every single API call — this is exactly
    # why the `/socket.io/` block below (which already omits the trailing
    # slash) works and this one didn't.
    location /api/ {
        proxy_pass http://backend:5000;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    # Proxy Socket.io requests
    location /socket.io/ {
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header Host $host;

        proxy_pass http://backend:5000;

        # Enable WebSockets
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";

        # Nginx's default 60s read timeout drops idle WebSocket
        # connections — extend it well past Socket.io's own ping interval.
        proxy_read_timeout 3600s;
    }
}
