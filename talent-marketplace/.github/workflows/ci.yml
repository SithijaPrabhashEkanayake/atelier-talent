name: CI Pipeline

on:
  push:
    branches: [ main, master ]
  pull_request:
    branches: [ main, master ]

jobs:
  backend-test:
    name: Backend Test Suite
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'npm'
          cache-dependency-path: talent-marketplace/backend/package-lock.json

      - name: Install Dependencies
        working-directory: talent-marketplace/backend
        run: npm ci

      - name: Run Jest Test Suites
        working-directory: talent-marketplace/backend
        run: npm test
        env:
          NODE_ENV: test
          JWT_SECRET: test_jwt_secret_ci_key_32bytes_long_here
          REFRESH_TOKEN_SECRET: test_refresh_token_ci_key_32bytes_here

  frontend-build:
    name: Frontend Lint & Production Build
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'npm'
          cache-dependency-path: talent-marketplace/frontend/package-lock.json

      - name: Install Dependencies
        working-directory: talent-marketplace/frontend
        run: npm ci

      - name: Lint Frontend
        working-directory: talent-marketplace/frontend
        run: npm run lint

      - name: Build Production Bundle
        working-directory: talent-marketplace/frontend
        run: npm run build
