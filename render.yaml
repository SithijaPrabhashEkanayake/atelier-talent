services:
  - type: web
    name: atelier-talent
    runtime: node
    plan: free
    rootDir: talent-marketplace
    buildCommand: cd frontend && npm install && npm run build && cd ../backend && (npm ci --omit=dev || npm install --omit=dev)
    startCommand: cd backend && npm start
    healthCheckPath: /api/health
    envVars:
      - key: NODE_ENV
        value: production
      - key: PORT
        value: 5000
      - key: CLIENT_URL
        value: https://atelier-talent.onrender.com
      # MONGO_URI and the Cloudinary keys are real credentials — never commit
      # them. Set these in the Render dashboard (Environment tab) instead;
      # `sync: false` tells Render to expect a manually-set value and leave
      # it alone on redeploys. See talent-marketplace/README.md's "Free
      # Hosting" section for the one-time setup steps.
      - key: MONGO_URI
        sync: false
      - key: JWT_SECRET
        generateValue: true
      - key: JWT_EXPIRE
        value: 15m
      - key: REFRESH_TOKEN_SECRET
        generateValue: true
      - key: CLOUDINARY_CLOUD_NAME
        sync: false
      - key: CLOUDINARY_API_KEY
        sync: false
      - key: CLOUDINARY_API_SECRET
        sync: false
