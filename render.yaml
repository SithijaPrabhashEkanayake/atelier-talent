services:
  - type: web
    name: atelier-talent
    runtime: node
    plan: free
    rootDir: talent-marketplace
    buildCommand: cd frontend && npm install && npm run build && cd ../backend && (npm ci --omit=dev || npm install --omit=dev)
    startCommand: cd backend && npm start
    healthCheckPath: /api/health
    envVars:
      - key: NODE_ENV
        value: production
      - key: PORT
        value: 5000
      - key: CLIENT_URL
        value: https://atelier-talent.onrender.com
